<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>闲鱼</title>
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#172d49;background:#f2f6fc;--blue:#174a92;--line:#d7e2f2}

or:#9a301e}output{display:block}.danger{color:#983727}
.scan-field{display:grid;gap:6px;align-content:start;min-width:0}.scan-field button{justify-self:start}.scan-preview{position:relative;height:min(48dvh,420px);background:#172d49;border-radius:12px;overflow:hidden}
#scanVideo{display:block;width:100%;height:100%;object-fit:contain}
.scan-guide{position:absolute;inset:10%;border:2px solid #e5efff;border-radius:14px;pointer-events:none;box-shadow:0 0 0 100vmax #08245144}
#scanStatus{min-height:2.8em}
.more{position:relative}.more summary{list-style:none;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;background:#e6eefb;color:var(--blue);font-weight:700}.more summary::-webkit-details-marker{display:none}.more-options{position:absolute;right:0;top:calc(100% + 6px);z-index:2;min-width:132px;display:grid;gap:6px;background:white;padding:6px;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px #172d4926}#logList{padding:0;list-style:none}#logList li{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}#logList time{display:block;color:#4c607c;font-size:14px;margin-top:4px}
.search-input{position:relative;display:block}.search-input svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--blue);pointer-events:none}.search-input input{padding-left:38px}
.required-mark{color:#b12424;font-weight:700}.fields{align-items:start}.problem-option{display:flex;align-items:center;gap:10px;min-height:44px}.problem-option input{width:20px;height:20px;min-height:0;margin:0;accent-color:#b12424}.record-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.problem-tag{color:#a21b1b;background:#ffe6e5;font-weight:700}
[hidden]{display:none!important}
.hub{max-width:860px;padding-top:clamp(35px,10vw,100px)}.hub h1{font-size:42px;color:#182844}.hub-options{display:grid;gap:14px;margin-top:24px}.hub-option{text-align:left;background:#fff;border:1px solid var(--line);padding:20px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:105px}.hub-option strong{display:block;font-size:22px}.hub-option small{display:block;margin-top:7px;font-weight:400}.hub-option .arrow{font-size:24px}
.inventory-title{display:flex;gap:8px;align-items:center}.inventory-title h1{font-size:clamp(19px,5vw,26px)}.drop-shell{max-width:1060px}.drop-sidebar{display:grid;gap:8px;margin:12px 0;padding:10px;background:#213958;border-radius:16px}.drop-sidebar button{text-align:left;background:transparent;color:#fff}.drop-sidebar button[aria-current=true]{background:#36557b}.drop-layout{margin-top:20px}.drop-layout section{min-width:0}.drop-layout article .actions{margin-top:12px}.drop-layout h2{overflow-wrap:anywhere}.drop-metrics{margin:12px 0 18px}.drop-metrics .metric{background:#e6eefb}.drop-log{list-style:none;padding:0}.drop-log li{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}#dropError{color:#9a301e}.drop-details{display:grid;grid-template-columns:auto 1fr;gap:8px 14px}.drop-details dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media(min-width:680px){.hub-options{grid-template-columns:repeat(2,minmax(0,1fr))}.drop-layout{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px}.drop-sidebar{align-self:start;margin:0}.drop-menu-button{display:none}}
.drop-service-button{display:inline-flex;align-items:center;gap:6px}.drop-service-button svg{flex:none;width:17px;height:17px}.drop-service-tag{color:#a21b1b;background:#ffe6e5;font-weight:700}#dropServiceError{color:#9a301e}
.sale-address{margin:8px 0}.sale-address summary{cursor:pointer;color:var(--blue)}.sale-address p{white-space:pre-wrap}
#expenses{max-width:560px}
.expense-summary{margin:16px 0;padding:16px 20px}
.expense-summary strong{display:block;font-size:28px;margin-top:4px;overflow-wrap:anywhere}
.expense-calendar{background:white;border:1px solid var(--line);border-radius:16px;padding:10px}
.expense-calendar .row{margin-bottom:10px;text-align:center}
.expense-calendar .row h2{font-size:18px}
.expense-calendar .row button{flex:none;padding-inline:9px}
.expense-week,.expense-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.expense-week{text-align:center;font-size:13px;margin-bottom:6px}
.expense-day{min-width:0;min-height:52px;padding:4px 1px;background:#f2f6fc;display:grid;justify-items:center;align-content:center;gap:3px;border-radius:8px}
.expense-day.has-expense{background:#e1edff}
.expense-day[aria-current="date"]{box-shadow:inset 0 0 0 2px var(--blue)}
.expense-day small{font-size:12px;line-height:1.15;font-weight:600;color:inherit;overflow-wrap:anywhere;max-width:100%}
#expenseReadError,#expenseError{color:#9a301e}
#expenseEditor label{margin-top:12px}
#payments{max-width:560px}
#paymentForm{margin:0}
#paymentForm label{min-width:0}
#paymentError,#paymentChangeError{color:#9a301e}
#paymentForm .fields,#paymentChangeForm .fields{margin:12px 0}
.payment-note{white-space:pre-wrap}
.payment-positive{color:#176239}
.payment-negative{color:#a21b1b}
.payment-state{display:inline-block;margin-top:4px;min-height:44px;background:#e3f3e8}
.payment-state.payment-negative{background:#ffe6e5}
#paymentList .actions{margin-top:10px}
#paymentList .row{align-items:start}
#paymentList strong{white-space:nowrap}
#paymentList h3{min-width:0}
#tabs button[data-tab="sold"]{position:relative;padding-inline:17px}
.pending-count{display:inline-grid;place-items:center;min-width:20px;padding:2px 5px;border-radius:20px;background:#087642;color:white;font-size:11px;font-weight:700;line-height:16px;font-variant-numeric:tabular-nums}
#tabs .pending-count{position:absolute;top:2px;right:2px;transform:translateX(20%);pointer-events:none}
.pending-shipments{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:white}
.pending-shipments>summary{padding:12px;min-height:44px;color:var(--blue);cursor:pointer;font-weight:700}
.pending-shipments>summary .pending-count{margin-left:6px;vertical-align:middle}
.pending-shipments[open]{padding-bottom:10px}
.pending-shipments-content{padding:0 10px}
.pending-shipments-content>.group:first-child{margin-top:4px}
</style>
<main id="hub" class="hub">
<h1 tabindex="-1">闲鱼</h1>
<div class="hub-options">
  <button class="hub-option" id="openInventory"><span><strong>拍机堂</strong><small>管理库存、入库、出库与售后</small></span><span class="arrow" aria-hidden="true">›</span></button>
  <button class="hub-option" id="openDropship"><span><strong>代发</strong><small>管理代发订单、发货状态与利润</small></span><span class="arrow" aria-hidden="true">›</span></button>
  <button class="hub-option" id="openExpenses" type="button"><span><strong>超擦支出</strong><small>记录每日金额，查看每月总支出</small></span><span class="arrow" aria-hidden="true">›</span></button>
  <button class="hub-option" id="openPayments" type="button"><span><strong>货款明细</strong><small>录入货款，查看明细和合计</small></span><span class="arrow" aria-hidden="true">›</span></button>
  <button class="hub-option" id="backup" type="button"><span><strong>数据备份</strong><small>导出或恢复四个模块的数据</small></span><span class="arrow" aria-hidden="true">›</span></button>
</div>
</main>
<main id="inventory" hidden>
<header><div class="inventory-title"><button type="button" data-home>首页</button><h1 tabindex="-1">拍机堂出入库</h1></div><details class="more" id="more"><summary aria-label="更多">•••</summary><div class="more-options"><button id="logs">日志</button></div></details></header>
<section class="hero" aria-label="统计"><small id="summaryTitle"></small><div class="metrics" id="metrics"></div></section>
<div class="row"><h2 id="heading"></h2><button class="primary" id="add"></button></div>
<div class="filters">
<label class="wide">搜索<span class="search-input">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
  <input id="query" type="search" placeholder="物品编号或单号（支持后四位）" autocapitalize="off" spellcheck="false">
</span></label>
<label>状态<select id="filter"></select></label>
<label>清除筛选<button id="reset">显示全部</button></label>
</div>
<section id="records"></section>
</main>
<nav id="inventoryNav" aria-label="拍机堂功能" hidden><div id="tabs"></div></nav>
<main id="dropship" class="drop-shell" hidden>
<header><div class="inventory-title"><button id="dropMenu" class="drop-menu-button" type="button" aria-controls="dropSidebar" aria-expanded="false">菜单</button><h1 tabindex="-1">代发</h1></div><button type="button" data-home>首页</button></header>
<div class="drop-layout">
  <aside id="dropSidebar" class="drop-sidebar" aria-label="代发导航"><button data-drop-view="orders" aria-current="true">订单管理</button><button data-drop-view="profit">利润统计</button><button data-drop-view="logs">操作日志</button></aside>
  <section id="dropOrders" aria-labelledby="dropOrdersHeading">
    <div class="row"><h2 id="dropOrdersHeading">订单管理</h2><button id="newDropOrder" class="primary" type="button">＋ 新增订单</button></div>
    <div class="filters"><label>搜索单号<input id="dropQuery" type="search" placeholder="输入快递单号" autocapitalize="off"></label><label>状态<select id="dropFilter"><option value="">全部状态</option><option value="pending">待发货</option><option value="shipped">已发货</option><option value="done">已完成</option></select></label></div>
    <div id="dropRows"></div>
  </section>
  <section id="dropProfit" aria-labelledby="dropProfitHeading" hidden><h2 id="dropProfitHeading">利润统计</h2><div id="dropTotals" class="metrics drop-metrics"></div><div id="dropProfitRows"></div></section>
  <section id="dropLogs" aria-labelledby="dropLogsHeading" hidden><h2 id="dropLogsHeading">操作日志</h2><ul id="dropLogRows" class="drop-log"></ul></section>
</div>
</main>
<main id="expenses" hidden>
<header><div class="inventory-title"><button type="button" data-home>首页</button><h1 tabindex="-1">超擦支出</h1></div></header>
<section class="hero expense-summary" aria-label="月度支出汇总">
  <small>当月总支出</small><strong id="expenseTotal" aria-live="polite"></strong>
</section>
<section class="expense-calendar" aria-labelledby="expenseMonth">
  <div class="row"><button id="expensePrev" type="button">上月</button><h2 id="expenseMonth" aria-live="polite"></h2><button id="expenseNext" type="button">下月</button></div>
  <div class="expense-week muted" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
  <div class="expense-days" id="expenseDays"></div>
</section>
<p id="expenseReadError" role="alert" hidden></p>
</main>
<main id="payments" hidden>
<header><div class="inventory-title"><button type="button" data-home>首页</button><h1 tabindex="-1">货款明细</h1></div></header>
<section class="hero expense-summary" aria-label="货款汇总">
  <small>总金额（已扣除未支付）</small><strong id="paymentTotal" aria-live="polite"></strong>
</section>
<article>
  <h2>录入货款</h2>
  <form id="paymentForm">
    <div class="fields">
      <label class="wide">款项名称<input name="paymentName" type="text" maxlength="80" required></label>
      <label>金额（元）<input name="paymentAmount" type="number" inputmode="decimal" min="0.01" max="9999999.99" step="0.01" required></label>
      <label>款项状态<select name="paymentStatus"><option value="regular">普通货款</option><option value="unpaid">未支付（我需付款）</option></select></label>
      <label class="wide">备注<textarea name="paymentNote" rows="2" maxlength="300"></textarea></label>
    </div>
    <button class="primary" type="submit">保存货款</button>
  </form>
</article>
<p id="paymentError" role="alert" hidden></p>
<section aria-labelledby="paymentHeading">
  <h2 id="paymentHeading">已录入货款</h2>
  <div id="paymentList"></div>
</section>
</main>
<dialog id="paymentChange" aria-labelledby="paymentChangeTitle">
  <h2 id="paymentChangeTitle"></h2>
  <form id="paymentChangeForm">
    <div class="fields">
      <label class="wide" id="paymentStatusField">款项状态<select name="status"><option value="regular">普通货款</option><option value="unpaid">未支付（我需付款）</option></select></label>
      <label class="wide" id="paymentNoteField">备注<textarea name="note" rows="3" maxlength="300"></textarea></label>
    </div>
    <output id="paymentChangeError" role="alert"></output>
    <div class="actions"><button class="primary" type="submit">保存</button><button type="button" id="paymentChangeCancel">取消</button></div>
  </form>
</dialog>
<dialog id="expenseEditor" aria-labelledby="expenseDateHeading">
<h2 id="expenseDateHeading"></h2>
<form id="expenseForm">
  <label>当天支出（元）<input id="expenseAmount" type="number" inputmode="decimal" min="0" max="9999999.99" step="0.01" required></label>
  <output id="expenseError" role="alert"></output>
  <div class="actions">
    <button class="primary" type="submit">保存</button>
    <button id="expenseCancel" type="button">取消</button>
    <button id="expenseClear" type="button" class="danger" hidden>清除金额</button>
  </div>
</form>
</dialog>
<dialog id="dropEditor"><h2 id="dropFormTitle">新增代发订单</h2>
<form id="dropForm"><div class="fields">
  <label>网络<select name="network" required><option value="">请选择网络</option><option>Wi-Fi</option><option>插卡</option><option>无锁Wi-Fi</option><option>无锁插卡</option></select></label>
  <label>指纹<select name="fingerprint" required><option value="">请选择指纹</option><option>指纹</option><option>无指纹</option></select></label>
  <label>内存<select name="memory" required><option value="">请选择内存</option><option value="32">32 GB</option><option value="128">128 GB</option></select></label>
  <label>代发渠道<input name="supplier" required maxlength="100"></label>
  <label>成本（元）<input type="number" inputmode="decimal" name="cost" required min="0" max="9999999.99" step="0.01"></label>
  <label>售价（元）<input type="number" inputmode="decimal" name="price" required min="0" max="9999999.99" step="0.01"></label>
  <label>快递单号<input name="tracking" maxlength="100" autocapitalize="off"></label>
  <label>下单日期<input type="date" name="date" required></label>
  <label>状态<select name="status"><option value="pending">待发货</option><option value="shipped">已发货</option><option value="done">已完成</option></select></label>
  <label class="wide">收货地址<textarea name="address" rows="3" maxlength="500" placeholder="可粘贴收件人、手机号和详细地址"></textarea></label>
  <label class="wide">备注<textarea name="note" maxlength="1000"></textarea></label>
</div><output id="dropError" role="alert"></output><div class="actions"><button class="primary">保存</button><button id="cancelDropOrder" type="button">取消</button></div></form></dialog>
<dialog id="dropService" aria-labelledby="dropServiceTitle">
<h2 id="dropServiceTitle">代发售后</h2>
<form id="dropServiceForm">
  <label>售后类型<select name="kind" required><option value="">请选择</option><option value="exchange">换货</option><option value="return">退货</option></select></label>
  <div id="dropExchangeFields" class="fields filters" hidden>
    <label class="wide">换货单号<input name="exchangeTracking" maxlength="100" autocapitalize="off" spellcheck="false" disabled></label>
    <label class="wide">是否更换配置<select name="changeSpec" disabled><option value="no">否，沿用原配置</option><option value="yes">是，选择新配置</option></select></label>
    <div id="dropExchangeSpecs" class="fields wide" hidden>
      <label>网络<select name="network" disabled><option value="">请选择网络</option><option>Wi-Fi</option><option>插卡</option><option>无锁Wi-Fi</option><option>无锁插卡</option></select></label>
<label>指纹<select name="fingerprint" disabled><option value="">请选择指纹</option><option>指纹</option><option>无指纹</option></select></label>
<label>内存<select name="memory" disabled><option value="">请选择内存</option><option value="32">32 GB</option><option value="128">128 GB</option></select></label>
    </div>
  </div>
  <output id="dropServiceError" role="alert"></output>
  <div class="actions"><button class="primary">保存</button><button id="cancelDropService" type="button">取消</button></div>
</form></dialog>
<dialog id="dropDetail"><h2>订单详情</h2><dl class="drop-details" id="dropDetailRows"></dl><div class="actions"><button id="closeDropDetail" type="button">关闭</button></div></dialog>
<dialog id="editor"><h2 id="formTitle"></h2><form id="form"><div id="fields" class="fields"></div><output id="notice" role="alert"></output><div class="actions"><button class="primary">保存</button><button type="button" id="cancel">取消</button></div></form></dialog>
<dialog id="scanPanel"><h2>扫码录入物品编号</h2><p id="scanStatus" role="status"></p><div class="scan-preview"><video id="scanVideo" autoplay playsinline muted></video><div class="scan-guide" aria-hidden="true"></div></div><div class="actions"><button type="button" id="pickScanPhoto">从照片识别</button><button type="button" id="closeScan">关闭扫码</button></div><input id="scanPhoto" type="file" accept="image/*" hidden></dialog>
<dialog id="backupPanel"><h2>数据备份</h2><p>一份 JSON 包含拍机堂、代发、超擦支出和货款明细。导入会覆盖备份所含模块的当前数据。</p><div class="actions"><button id="export">导出 JSON</button><button id="restore">导入备份</button><button id="closeBackup">关闭</button></div><input id="file" type="file" accept=".json,application/json" hidden></dialog>
<dialog id="logPanel"><div class="row"><h2>操作日志</h2><button id="closeLog">关闭</button></div><ul id="logList"></ul></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'phone-inventory-v1';
const names = {stock:'库存', inbound:'入库', sold:'出库', profit:'利润', service:'售后'};
const states = {available:'在库', sold:'已售出', open:'售后处理中', closed:'售后已完成', returned:'退货已回库'};
const exchangeStates = {
  sentWaiting:'新机已寄出，旧机未取回',
  sentReceived:'新机已寄出，旧机已取回',
  waitingBoth:'新机未寄出，旧机未取回',
  waitingNew:'新机未寄出，旧机已取回'
};
const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const money = cents => '¥' + (cents/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const status = item => item.service?.state === 'returned' ? 'returned' : item.service?.state ?? (item.sale ? 'sold' : 'available');
const inStock = item => !item.sale || status(item) === 'returned';
const activeSale = item => item.sale && status(item) !== 'returned';
const needsTracking = item => activeSale(item) && !String(item.sale.tracking ?? '').trim();
const imeiPattern = /^\d{15}$/;
const itemNumberPattern = /^\d{20}$/;
let page = 'stock';
let storageError = false;
let source = null;
let items = [];
let logs = [];
try {
  source = localStorage.getItem(key);
  if (source !== null) {
    const data = JSON.parse(source);
    if (Array.isArray(data)) items = validate(data);
    else {
      const savedLogs = validateLogs(data.logs);
      items = validate(data.items);
      logs = savedLogs;
    }
  }
} catch { storageError = true; }
let mode, selected;

function validItemCode(value) {
  return value.length > 0 && value.length <= 128 && value === value.trim() && !/[\u0000-\u001f\u007f]/.test(value);
}

function validate(data) {
  const date = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
    Number.isFinite(Date.parse(value)) && new Date(value).toISOString().slice(0,10) === value;
  const amount = value => Number.isSafeInteger(value) && value >= 0 && value <= 99999999999;
  const ids = new Set(), imeis = new Set(), serials = new Set();
  if (!Array.isArray(data)) throw Error('备份格式无效');
  for (const item of data) {
    if (!item || typeof item.id !== 'string' || !/^[\w-]+$/.test(item.id) || ids.has(item.id) ||
        typeof item.model !== 'string' || !item.model.trim() || typeof item.imei !== 'string' ||
        !imeiPattern.test(item.imei) || imeis.has(item.imei) || typeof item.serial !== 'string' ||
        !validItemCode(item.serial) || serials.has(item.serial.toUpperCase()) || !amount(item.cost) ||
        (item.inbound !== null && !date(item.inbound)) ||
        (item.sale && (!date(item.sale.date) || !amount(item.sale.price) || item.sale.date < item.inbound)) ||
        (!item.sale && !item.inbound) ||
        (item.history !== undefined && (!Array.isArray(item.history) || item.history.some(entry =>
          !entry || !date(entry.sale?.date) || !amount(entry.sale.price) ||
          !date(entry.service?.date) || entry.service.date < entry.sale.date ||
          entry.service.state !== 'returned' || typeof entry.service.reason !== 'string'))) ||
        (item.service && (!item.sale || !date(item.service.date) || item.service.date < item.sale.date ||
          !['open','closed','returned'].includes(item.service.state) ||
          typeof item.service.reason !== 'string' || !item.service.reason.trim()))) {
      throw Error('记录无效或 IMEI / 物品编号重复，请检查日期和设备信息');
    }
    ids.add(item.id); imeis.add(item.imei); serials.add(item.serial.toUpperCase());
  }
  return data;
}

function validateLogs(data) {
  if (!Array.isArray(data) || data.some(entry => !entry ||
      typeof entry.action !== 'string' || typeof entry.detail !== 'string' ||
      !Number.isFinite(Date.parse(entry.time)))) throw Error('日志格式无效');
  return data;
}

function save(next, action, detail, {recover = false, previousLogs = logs} = {}) {
  validate(next);
  if (storageError && !recover) throw Error('现有数据无法读取，请从有效备份恢复');
  if (localStorage.getItem(key) !== source) throw Error('另一窗口已更新数据，请刷新后重试');
  const nextLogs = [{time:new Date().toISOString(), action, detail}, ...previousLogs];
  const encoded = JSON.stringify({items:next,logs:nextLogs});
  localStorage.setItem(key, encoded);
  source = encoded;
  items = next;
  logs = nextLogs;
  storageError = false;
}

function tab(next) {
  page = next;
  $('filter').innerHTML = '<option value="">全部状态</option>' +
    Object.entries(states).filter(([code]) => page !== 'service' || ['open','closed','returned'].includes(code))
      .map(([code,label]) => `<option value="${code}">${label}</option>`).join('');
  render();
}

function dateFor(item) {
  if (page === 'service') return item.service.date;
  if (page === 'sold' || page === 'profit') return item.sale.date;
  return status(item) === 'returned' && page === 'stock' ? item.service.date : item.inbound;
}

function saleCharges(item) {
  const address = String(item.sale.address ?? '').trim();
  const region = address.match(/北京|天津|河北|山西|内蒙古|辽宁|吉林|黑龙江|上海|江苏|浙江|安徽|福建|江西|山东|河南|湖北|湖南|广东|广西|海南|重庆|四川|贵州|云南|西藏|陕西|甘肃|青海|宁夏|新疆|台湾|香港|澳门/)?.[0];
  const rate = ['北京','上海'].includes(region) ? 400 :
    ['海南','宁夏','青海'].includes(region) ? 700 :
    ['西藏','新疆'].includes(region) ? 1500 : 300;
  const trips = item.service?.reason === '换货' ? 3 : 1;
  const fee = String(item.sale.channel ?? '').trim() === '代发' ? 0 : Math.round(item.sale.price * 16 / 1000);
  const freight = rate * trips;
  return {fee,freight,trips,region,net:item.sale.price-item.cost-fee-freight};
}

function totals(rows) {
  const sales = rows.filter(activeSale);
  const revenue = sales.reduce((sum,item) => sum + item.sale.price,0);
  const cost = sales.reduce((sum,item) => sum + item.cost,0);
  const metrics = [['有效出库',sales.length+' 台'],['销售额',money(revenue)],['销售成本',money(cost)],['毛利润',money(revenue-cost)]];
  if (page === 'profit') {
    const charges = sales.map(saleCharges);
    const sum = name => charges.reduce((total,item) => total+item[name],0);
    metrics.push(['平台手续费',money(sum('fee'))],['运费',money(sum('freight'))],['实际利润',money(sum('net'))]);
  }
  return metrics;
}

function action(label, command, item, style = '') {
  return `<button class="${style}" data-command="${command}" data-id="${item.id}">${label}</button>`;
}

function card(item) {
  const historyInfo = item.history?.length ? `<details><summary>历史退货（${item.history.length} 笔）</summary>
    ${item.history.map(entry => `<p>出库 ${escape(entry.sale.date)} · ${money(entry.sale.price)} ${entry.sale.tracking ? '· 单号 '+escape(entry.sale.tracking) : ''} · 退货 ${escape(entry.service.date)} · ${escape(entry.service.reason)}</p>`).join('')}</details>` : '';
  const tracking = item.sale?.tracking ? `<p class="muted">单号 ${escape(item.sale.tracking)}</p>` : '';
  const saleInfo = item.sale && page !== 'stock' && page !== 'inbound'
    ? `<p>售价 ${money(item.sale.price)} · ${escape(item.sale.channel || '未填写销售渠道')}</p>` : '';
  const saleAddress = page === 'sold' && item.sale?.address
    ? `<details class="sale-address"><summary>收货地址</summary><p>${escape(item.sale.address)}</p></details>` : '';
  const charges = page === 'profit' ? saleCharges(item) : null;
  const profitInfo = charges ? `<p><strong>实际利润 ${money(charges.net)}</strong></p>
    <p class="muted">手续费 ${money(charges.fee)} · 运费 ${money(charges.freight)}（${charges.trips} 程${charges.region ? ' · '+charges.region : ' · 未识别地区，按 ¥3/程'}）</p>` : '';
  const serviceInfo = item.service && page === 'service'
    ? `<p>${escape(item.service.reason)}${Object.hasOwn(exchangeStates,item.service.exchangeStatus) ? ' · '+exchangeStates[item.service.exchangeStatus] : ''}</p><p class="muted">${escape(item.service.note)}</p>` : '';
  let buttons = '';
  if (page === 'stock' || page === 'inbound') {
    buttons = action('编辑','device',item);
    if (inStock(item)) buttons += action('标记售出','sell',item,'primary');
    if (!item.sale && !item.history?.length) buttons += action('删除','deleteDevice',item,'danger');
  }
  if (page === 'sold') {
    buttons = action('编辑','saleEdit',item) + action(item.service ? '编辑售后' : '转售后','service',item);
    if (!item.service) buttons += action('删除出库','deleteSale',item,'danger');
  }
  if (page === 'service') buttons = action('编辑 / 标记状态','service',item) + action('删除售后','deleteService',item,'danger');
  return `<article><div class="row"><h3>${escape(item.model)} ${escape(item.capacity)}</h3><div class="record-tags">${item.problem === true && (page === 'stock' || page === 'inbound') ? '<span class="tag problem-tag">问题机</span>' : ''}<span class="tag">${states[status(item)]}</span></div></div>
    <p class="muted">IMEI ${escape(item.imei)} · 物品编号 ${escape(item.serial)}</p>
    <p>成本 ${money(item.cost)} ${escape(item.channel || '')}</p>
    ${saleInfo}${tracking}${saleAddress}${profitInfo}${serviceInfo}${historyInfo}<p class="muted">${escape(item.note || '')}</p>
    <div class="actions">${buttons}</div></article>`;
}

function render() {
  $('heading').textContent = names[page];
  const addLabel = {stock:'＋ 入库',inbound:'＋ 录入',sold:'＋ 直接出库'};
  $('add').hidden = !addLabel[page];
  $('add').textContent = addLabel[page] || '';
  const pendingCount = items.filter(needsTracking).length;
  $('tabs').innerHTML = Object.entries(names).map(([code,label]) => {
    const showCount = code === 'sold' && pendingCount > 0;
    const badge = showCount ? `<span class="pending-count" aria-hidden="true">${pendingCount}</span>` : '';
    const description = showCount ? ` aria-label="出库，${pendingCount} 单未填单号"` : '';
    return `<button data-tab="${code}" aria-current="${code === page}"${description}>${label}${badge}</button>`;
  }).join('');
  const query = $('query').value.trim().toLowerCase();
  const filter = $('filter').value;
  const rows = items.filter(item => {
    if (!({stock:inStock(item),inbound:item.inbound,sold:item.sale,profit:activeSale(item),service:item.service})[page]) return false;
    return (!filter || status(item) === filter) && (!query ||
      [item.serial,item.sale?.tracking,...(item.history ?? []).map(entry => entry.sale.tracking)]
        .some(value => {
          const number = String(value ?? '').trim().toLowerCase();
          return number === query || (query.length === 4 && number.endsWith(query));
        }));
  });
  const cost = list => money(list.reduce((sum,item) => sum+item.cost,0));
  const stats = page === 'profit' || page === 'sold' ? totals(rows) : page === 'service'
    ? [['售后记录',rows.length+' 单'],['处理中',rows.filter(item => status(item) === 'open').length+' 单']]
    : [[page === 'stock' ? '在库数量' : '入库数量',rows.length+' 台'],['设备成本',cost(rows)]];
  $('summaryTitle').textContent = names[page]+' · 当前筛选统计';
  $('metrics').innerHTML = stats.map(([label,value]) => `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`).join('');
  const records = $('records');
  const pending = [];
  const regular = [];
  for (const item of rows.sort((a,b) => dateFor(b).localeCompare(dateFor(a)))) {
    (page === 'sold' && needsTracking(item) ? pending : regular).push(item);
  }
  const shipOpen = Boolean(query) || records.querySelector('#pendingShipments')?.open;
  const pendingSection = pending.length ? `<details class="pending-shipments" id="pendingShipments"${shipOpen ? ' open' : ''}>
    <summary>未发货 · 未填单号 <span class="pending-count">${pending.length}</span></summary>
    <div class="pending-shipments-content">${renderRecordGroups(pending,cost)}</div>
  </details>` : '';
  records.innerHTML = (pendingSection + renderRecordGroups(regular,cost)) || '<p class="empty">'+
    (storageError ? '本机数据无法读取，请从有效备份恢复。' : '暂无符合条件的记录。')+'</p>';
}

function renderRecordGroups(rows,cost) {
  const groups = new Map();
  for (const item of rows) {
    const date = dateFor(item);
    if (!groups.has(date)) groups.set(date,[]);
    groups.get(date).push(item);
  }
  return [...groups].map(([date,list]) => {
    const caption = page === 'profit' || page === 'sold' ? totals(list).map(pair => pair.join(' ')).join(' · ')
      : `${list.length} 条${page === 'service' ? '' : ' · 成本 '+cost(list)}`;
    return `<section class="group"><h3>${escape(date)}</h3><p class="muted">${caption}</p>${list.map(card).join('')}</section>`;
  }).join('');
}

const requiredMark = '<span class="required-mark" aria-hidden="true"> *</span>';

function field(name,label,value='',attrs='',type='text') {
  return `<label><span>${label}${['imei','serial','cost'].includes(name) ? requiredMark : ''}</span><input name="${name}" type="${type}" value="${escape(value)}" ${attrs}></label>`;
}
function choice(name,label,options,current,defaultValue) {
  const value = current || defaultValue;
  const values = options.includes(value) ? options : [...options, value];
  return `<label><span>${label}${name === 'model' ? requiredMark : ''}</span><select name="${name}"${name === 'model' ? ' required' : ''}>${values.map(option =>
    `<option value="${escape(option)}" ${option === value ? 'selected' : ''}>${escape(option || "请选择")}</option>`
  ).join('')}</select></label>`;
}

function customChoice(name,label,options,current,defaultValue) {
  const custom = current && current !== '其他' && !options.includes(current) ? current : '';
  const selected = custom ? '其他' : current;
  return `<div class="scan-field">${choice(name,label,[...options,'其他'],selected,defaultValue)}
    <div${selected === '其他' ? '' : ' hidden'}>
      ${field(name+'Custom','自定义'+label,custom,'maxlength="80"')}
    </div></div>`;
}

function syncCustomChoice(select) {
  const input = select.form.elements.namedItem(select.name+'Custom');
  if (!input) return;
  const isCustom = select.value === '其他';
  input.closest('label').parentElement.hidden = !isCustom;
  input.disabled = !isCustom;
}

function itemCodeField(value) {
  return `<div class="scan-field">${field('serial','物品编号',value,'required inputmode="numeric" autocapitalize="off" spellcheck="false"')}
    <button type="button" data-scan aria-label="扫码录入物品编号">扫码录入</button></div>`;
}

function note(value) {
  return `<label class="wide">备注<textarea name="note">${escape(value)}</textarea></label>`;
}
function syncServiceProgress() {
  const fields = $('form').elements;
  const exchange = fields.namedItem('reason').value === '换货';
  $('exchangeProgress').hidden = !exchange;
  $('returnProgress').hidden = exchange;
  fields.namedItem('exchangeStatus').disabled = !exchange;
  fields.namedItem('state').disabled = exchange;
}

function openForm(next,item) {
  mode = next;
  selected = item;
  const deviceFields = ['device','direct'].includes(mode);
  const selling = ['direct','sell','saleEdit'].includes(mode);
  const service = item?.service;
  const sale = mode === 'saleEdit' ? item.sale : null;
  const amount = (name,label,value) => field(name,label,value == null ? '' : value/100,
    'inputmode="decimal" min="0" max="999999999.99" step="0.01" required','number');
  $('formTitle').textContent = {device:item ? '编辑设备' : '新增入库',sell:'标记售出',direct:'直接登记出库',saleEdit:'编辑出库',service:'售后登记'}[mode];
  let html = '';
  if (deviceFields) {
    html += customChoice('model','型号',['原机','原机Wi-Fi'],item?.model,'原机') +
      choice('capacity','容量',['32','128','256'],item?.capacity,'128') +
      field('imei','IMEI',item?.imei,'required inputmode="numeric"') +
      itemCodeField(item?.serial) +
      amount('cost','成本（元）',item?.cost) +
      customChoice('channel','进货渠道',['拍机堂'],item?.channel,'拍机堂');
    if (mode === 'device' && (!item || item.inbound)) html += field('inbound','入库日期',item?.inbound || today(),'required','date');
    html += `<label class="wide problem-option"><input type="checkbox" name="problem"${item?.problem === true ? ' checked' : ''}>问题机</label>` +
      note(item?.note ?? '');
  }
  if (selling) {
    html += field('date','出库日期',sale?.date || today(),'required','date') +
      amount('price','售价（元）',sale?.price) + customChoice('saleChannel','销售渠道',['','闲鱼','代发'],sale?.channel,'') +
      field('tracking','单号',sale?.tracking) +
      `<label class="wide">收货地址<textarea name="saleAddress" rows="3" maxlength="500" placeholder="请包含省份或直辖市，用于计算运费">${escape(sale?.address)}</textarea></label>`;
  }
  if (mode === 'service') {
    html = field('date','售后日期',service?.date || today(),'required','date') +
      `<label>售后原因<select name="reason" required><option value="" disabled>请选择原因</option>
        ${['换货','退货'].map(reason => `<option ${service?.reason === reason ? 'selected' : ''}>${reason}</option>`).join('')}</select></label>
      <div class="wide" id="exchangeProgress"><label>处理状态<select name="exchangeStatus">
        ${Object.entries(exchangeStates).map(([code,label]) => `<option value="${code}" ${code === (service?.exchangeStatus ?? (service?.state === 'closed' ? 'sentReceived' : 'waitingBoth')) ? 'selected' : ''}>${label}</option>`).join('')}
      </select></label></div>
      <div class="wide" id="returnProgress"><label>处理状态<select name="state">${['open','closed','returned'].map(state =>
        `<option value="${state}" ${service?.state === state ? 'selected' : ''}>${states[state]}</option>`).join('')}</select></label></div>` +
      note([service?.reason && !['换货','退货'].includes(service.reason) ? '原售后原因：'+service.reason : '',service?.note].filter(Boolean).join('\n'));
  }
  $('form').noValidate = deviceFields;
  $('fields').innerHTML = html;
  for (const select of $('fields').querySelectorAll('select[name="model"], select[name="channel"], select[name="saleChannel"]')) {
    syncCustomChoice(select);
  }
  if (mode === 'service') {
    if (!['换货','退货'].includes(service?.reason)) $('form').elements.namedItem('reason').value = '';
    syncServiceProgress();
  }
  $('notice').textContent = '';
  $('editor').showModal();
}

$('form').addEventListener('submit',event => {
  event.preventDefault();
  const values = Object.fromEntries([...new FormData(event.target)].map(([name,value]) => [name,value.trim()]));
  if (mode === 'device' || mode === 'direct') {
    for (const [name,pattern,message] of [
      ['imei',imeiPattern,'IMEI 必须是 15 位数字。'],
      ['serial',itemNumberPattern,'物品编号必须是 20 位数字。']
    ]) {
      if (pattern.test(values[name] ?? '')) continue;
      alert(message);
      event.target.elements.namedItem(name).focus();
      return;
    }
    if (!event.target.reportValidity()) return;
  }
  try {
    const item = selected ? {...selected} : {id:crypto.randomUUID(),inbound:null};
    if (mode === 'device' || mode === 'direct') Object.assign(item,{
      model:values.model === '其他' ? values.modelCustom || '其他' : values.model, capacity:values.capacity, imei:values.imei, serial:values.serial, problem:values.problem === 'on',
      cost:Math.round(Number(values.cost)*100), channel:values.channel === '其他' ? values.channelCustom || '其他' : values.channel, note:values.note, inbound:mode === 'direct' ? null : values.inbound || item.inbound
    });
    if (mode === 'sell' && item.service?.state === 'returned') {
      if (values.date < item.service.date) throw Error('再次出库日期应晚于或等于回库日期');
      item.history = [...(item.history || []), {sale:item.sale, service:item.service}];
      item.inbound ||= item.service.date;
      delete item.service;
    }
    if (['direct','sell','saleEdit'].includes(mode)) item.sale = {
      date:values.date, price:Math.round(Number(values.price)*100), channel:values.saleChannel === '其他' ? values.saleChannelCustom || '其他' : values.saleChannel, tracking:values.tracking, address:values.saleAddress
    };
    if (mode === 'service') {
      const exchange = values.reason === '换货';
      if (!['换货','退货'].includes(values.reason) || (exchange && !Object.hasOwn(exchangeStates,values.exchangeStatus))) {
        throw Error('请选择售后原因和处理状态。');
      }
      const state = exchange ? (values.exchangeStatus === 'sentReceived' ? 'closed' : 'open') : values.state;
      item.service = {date:values.date, reason:values.reason, state, note:values.note};
      if (exchange) item.service.exchangeStatus = values.exchangeStatus;
    }
    const actionName = {
      device:selected ? '编辑设备' : '新增入库', direct:'直接出库', sell:'标记售出',
      saleEdit:'编辑出库', service:(selected?.service ? '更新售后 · ' : '新增售后 · ')+values.reason+' · '+(exchangeStates[values.exchangeStatus] ?? states[item.service?.state] ?? '')
    }[mode];
    save(selected ? items.map(old => old.id === item.id ? item : old) : [...items,item], actionName, describeItem(item));
    $('query').value = '';
    $('editor').close();
    tab(mode === 'direct' || mode === 'sell' ? 'sold' : page);
  } catch (error) { $('notice').textContent = error.message; }
});

$('records').addEventListener('click',event => {
  const button = event.target.closest('button[data-command]');
  if (!button) return;
  const item = items.find(row => row.id === button.dataset.id);
  const command = button.dataset.command;
  if (!command.startsWith('delete')) { openForm(command,item); return; }
  const warning = {
    deleteDevice:'确定删除这台设备及关联记录？',
    deleteSale:item.inbound ? '删除出库记录并恢复在库？' : '删除直接出库记录及对应设备？',
    deleteService:'删除售后记录并恢复已售出状态？'
  }[command];
  if (!confirm(warning)) return;
  try {
    const next = items.flatMap(row => {
      if (row.id !== item.id) return [row];
      if (command === 'deleteDevice' || (command === 'deleteSale' && !row.inbound)) return [];
      const updated = {...row};
      delete updated[command === 'deleteSale' ? 'sale' : 'service'];
      return [updated];
    });
    const actionName = {deleteDevice:'删除设备',deleteSale:'删除出库',deleteService:'删除售后'}[command];
    save(next,actionName,describeItem(item));
    render();
  } catch (error) { alert(error.message); }
});
let scannerLibrary;
let scanSession;

function loadScanner() {
  if (!scannerLibrary) {
    scannerLibrary = new Promise((resolve,reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
      script.onload = () => {
        const Reader = window.ZXingBrowser?.BrowserMultiFormatReader;
        if (Reader) resolve(Reader);
        else reject(Error('扫码组件不可用'));
      };
      script.onerror = () => {
        script.remove();
        reject(Error('扫码组件加载失败'));
      };
      document.head.append(script);
    }).catch(error => {
      scannerLibrary = null;
      throw error;
    });
  }
  return scannerLibrary;
}

function stopScan() {
  const session = scanSession;
  scanSession = null;
  clearTimeout(session?.timer);
  session?.stream?.getTracks().forEach(track => track.stop());
  $('scanVideo').srcObject = null;
}

function createBarcodeDecoder(Reader) {
  const reader = new Reader();
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d',{willReadFrequently:true});
  return (source,width,height,rotation) => {
    const sideways = rotation % 180 !== 0;
    canvas.width = sideways ? height : width;
    canvas.height = sideways ? width : height;
    context.translate(canvas.width/2,canvas.height/2);
    context.rotate(rotation*Math.PI/180);
    context.drawImage(source,-width/2,-height/2,width,height);
    try {
      const value = reader.decodeFromCanvas(canvas).getText().trim();
      return itemNumberPattern.test(value) ? value : '';
    } catch (error) {
      if (error instanceof TypeError) throw error;
      return ''; // No readable barcode in this frame.
    }
  };
}

function fillScannedCode(value) {
  $('form').elements.namedItem('serial').value = value;
  stopScan();
  $('scanPanel').close();
}

async function openScan() {
  stopScan();
  const session = {};
  scanSession = session;
  const video = $('scanVideo');
  const status = $('scanStatus');
  status.textContent = '正在打开相机…';
  $('scanPanel').showModal();
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Error('Camera unavailable');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false, video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}
    });
    if (scanSession !== session) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    session.stream = stream;
    video.srcObject = stream;
    await video.play();
    if (scanSession !== session) return;
    status.textContent = '正在加载扫码组件…';
    const Reader = await loadScanner();
    if (scanSession !== session) return;
    const decode = createBarcodeDecoder(Reader);
    const started = Date.now();
    let rotation = 0;
    status.textContent = '将 20 位物品编号的条码放在框内，横竖都可以。';
    const scanFrame = () => {
      if (scanSession !== session) return;
      try {
        if (!session.readingPhoto && video.readyState >= 2 && video.videoWidth) {
          const value = decode(video,video.videoWidth,video.videoHeight,rotation);
          if (value) { fillScannedCode(value); return; }
          rotation = rotation === 0 ? 90 : 0;
          if (Date.now() - started > 5500 && !session.hintShown) {
            status.textContent = '试试离标签稍远一点，避开反光，或从照片识别。';
            session.hintShown = true;
          }
        }
        session.timer = setTimeout(scanFrame,160);
      } catch {
        stopScan();
        status.textContent = '实时扫码暂不可用，可从照片识别或手动填写。';
      }
    };
    scanFrame();
  } catch (error) {
    if (scanSession !== session) return;
    stopScan();
    status.textContent = error.name === 'NotAllowedError'
      ? '相机权限未开启，可从照片识别或手动填写。'
      : '相机或扫码组件暂不可用，可从照片识别或手动填写。';
  }
}

$('pickScanPhoto').onclick = () => $('scanPhoto').click();
$('scanPhoto').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  const panel = $('scanPanel');
  if (!file || !panel.open) return;
  // Give each photo attempt its own identity so a late result cannot fill a reopened form.
  const session = scanSession || (scanSession = {});
  const attempt = {};
  session.readingPhoto = attempt;
  const status = $('scanStatus');
  status.textContent = '正在识别照片…';
  const url = URL.createObjectURL(file);
  try {
    const photo = new Image();
    const loaded = new Promise((resolve,reject) => {
      photo.onload = resolve;
      photo.onerror = reject;
    });
    photo.src = url;
    const [Reader] = await Promise.all([loadScanner(),loaded]);
    if (scanSession !== session || session.readingPhoto !== attempt) return;
    const decode = createBarcodeDecoder(Reader);
    const scale = Math.min(1,1920/Math.max(photo.naturalWidth,photo.naturalHeight));
    const width = Math.max(1,Math.round(photo.naturalWidth*scale));
    const height = Math.max(1,Math.round(photo.naturalHeight*scale));
    for (const rotation of [0,90,180,270]) {
      const value = decode(photo,width,height,rotation);
      if (value) { fillScannedCode(value); return; }
    }
    status.textContent = '照片里没有识别到 20 位物品编号，试试裁到只剩一张清晰的标签。';
  } catch {
    if (scanSession === session && session.readingPhoto === attempt) {
      status.textContent = '无法识别这张照片，请换一张或手动填写。';
    }
  } finally {
    URL.revokeObjectURL(url);
    if (session.readingPhoto === attempt) session.readingPhoto = null;
  }
};

<script>
(() => {
  'use strict';
  const dropKey = 'xianyu-dropship-v1';
  const statusNames = {pending:'待发货',shipped:'已发货',done:'已完成'};
  const serviceNames = {exchange:'换货',return:'退货'};
  const nextStatus = {pending:'shipped',shipped:'done'};
  const sections = {orders:'dropOrders',profit:'dropProfit',logs:'dropLogs'};
  const phoneLayout = matchMedia('(max-width:679px)');
  let dropSource;
  let dropState = {orders:[],logs:[]};
  let dropStorageError = false;
  let editedId = null;
  let serviceId = null;

  function readDropship() {
    try {
      dropSource = localStorage.getItem(dropKey);
      const data = dropSource === null ? {orders:[],logs:[]} : JSON.parse(dropSource);
      if (!Array.isArray(data.orders) || !Array.isArray(data.logs)) throw Error('代发数据格式无效');
      dropState = data;
      dropStorageError = false;
    } catch {
      dropStorageError = true;
    }
    renderDropship();
  }

  function setSidebar(expanded) {
    $('dropSidebar').hidden = phoneLayout.matches && !expanded;
    $('dropMenu').setAttribute('aria-expanded',String(expanded));
  }

  function showModule(id) {
    for (const panel of ['hub','inventory','dropship','expenses','payments']) $(panel).hidden = panel !== id;
    $('inventoryNav').hidden = id !== 'inventory';
    if (id === 'dropship') setSidebar(false);
    window.scrollTo(0,0);
    $(id).querySelector('h1').focus({preventScroll:true});
  }

  function showDropView(view) {
    for (const [name,id] of Object.entries(sections)) $(id).hidden = name !== view;
    for (const button of $('dropSidebar').querySelectorAll('[data-drop-view]')) {
      button.setAttribute('aria-current',String(button.dataset.dropView === view));
    }
    setSidebar(false);
    $(sections[view]).querySelector('h2').setAttribute('tabindex','-1');
    $(sections[view]).querySelector('h2').focus();
  }

  function saveDropship(orders, action, order) {
    if (dropStorageError) throw Error('本机代发数据无法读取，请刷新后重试。');
    if (localStorage.getItem(dropKey) !== dropSource) throw Error('代发数据已在另一窗口更新，请刷新后重试。');
    const entry = {action,product:order.product,at:new Date().toISOString()};
    const next = {orders,logs:[entry,...dropState.logs]};
    const encoded = JSON.stringify(next);
    localStorage.setItem(dropKey,encoded);
    dropSource = encoded;
    dropState = next;
    renderDropship();
  }

  function renderDropship() {
    const query = $('dropQuery').value.trim().toLowerCase();
    const filter = $('dropFilter').value;
    const orders = [...dropState.orders].sort((a,b) => b.date.localeCompare(a.date));
    const filtered = orders.filter(order => (!filter || filter === order.status) &&
      (!query || [order.tracking,order.exchange?.tracking].some(number => (number ?? '').toLowerCase().includes(query))));
    $('newDropOrder').disabled = dropStorageError;
    $('dropRows').innerHTML = dropStorageError ? '<p class="empty">本机代发数据无法读取。</p>' :
      filtered.map(order => {
        const move = nextStatus[order.status];
        return `<article><div class="row"><h3>${escape(order.product)}</h3><div class="record-tags"><span class="tag">${statusNames[order.status]}</span>${Object.hasOwn(serviceNames,order.afterSales) ? '<span class="tag drop-service-tag">售后</span>' : ''}</div></div>
          <p class="muted">${escape(order.date)} · ${escape(order.supplier)}</p>
          ${order.exchange
            ? `<p>原单号 ${escape(order.tracking || '—')}</p><p>换货单号 ${escape(order.exchange.tracking)}</p>
               <p>换货配置 ${escape(replacementSpec(order))}</p>`
            : order.tracking ? `<p>快递单号 ${escape(order.tracking)}</p>` : ''}
          <div class="actions">
            <button data-drop-action="detail" data-id="${escape(order.id)}">详情</button>
            <button data-drop-action="edit" data-id="${escape(order.id)}">编辑</button>
            ${move ? `<button class="primary" data-drop-action="advance" data-id="${escape(order.id)}">标记${statusNames[move]}</button>` : ''}
            <button class="drop-service-button" type="button" data-drop-action="service" data-id="${escape(order.id)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 10H3V4m0 6 4-4a8 8 0 1 1-2 9"/></svg>售后
            </button>
            <button class="danger" data-drop-action="delete" data-id="${escape(order.id)}">删除</button>
          </div></article>`;
      }).join('') || '<p class="empty">暂无符合条件的代发订单。</p>';
    const completed = orders.filter(order => order.status === 'done');
    const revenue = completed.reduce((sum,order) => sum+order.price,0);
    const costs = completed.reduce((sum,order) => sum+order.cost,0);
    const metrics = [['已完成订单',completed.length+' 笔'],['销售额',money(revenue)],['成本',money(costs)],['利润',money(revenue-costs)]];
    $('dropTotals').innerHTML = metrics.map(([label,value]) =>
      `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`).join('');
    $('dropProfitRows').innerHTML = completed.map(order =>
      `<article><div class="row"><h3>${escape(order.product)}</h3><strong>${money(order.price-order.cost)}</strong></div><p class="muted">${escape(order.date)}</p></article>`
    ).join('') || '<p class="empty">暂无已完成订单。</p>';
    $('dropLogRows').innerHTML = dropState.logs.map(entry =>
      `<li><strong>${escape(entry.action)}</strong><p>${escape(entry.product)}</p><time class="muted">${new Date(entry.at).toLocaleString('zh-CN',{hour12:false})}</time></li>`
    ).join('') || '<li class="empty">暂无操作日志。</li>';
  }

  function openDropForm(order) {
    editedId = order?.id ?? null;
    const form = $('dropForm');
    form.reset();
    $('dropFormTitle').textContent = order ? '编辑代发订单' : '新增代发订单';
    $('dropError').textContent = '';
    form.elements.namedItem('date').value = today();
    if (order) {
      for (const name of ['network','fingerprint','memory','supplier','tracking','date','status','address','note']) {
        form.elements.namedItem(name).value = order[name] ?? '';
      }
      form.elements.namedItem('price').value = order.price/100;
      form.elements.namedItem('cost').value = order.cost/100;
    }
    $('dropEditor').showModal();
  }

  const expenseKey = 'daily-extra-expenses-v1';
  const monthLabel = new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long'});
  const maxExpense = 999999999;
  let expenseMonth;
  let expenseDate;
  let expenseRecords = {};

  function readExpenses(raw = localStorage.getItem(expenseKey)) {
    return validateExpenses(JSON.parse(raw ?? '{}'));
  }

  function validateExpenses(records) {
    if (!records || typeof records !== 'object' || Array.isArray(records) ||
        Object.entries(records).some(([day,value]) => !/^\d{4}-\d{2}-\d{2}$/.test(day) ||
          !Number.isSafeInteger(value) || value < 0 || value > maxExpense)) {
      throw Error('无法读取支出记录。');
    }
    return records;
  }

  function renderExpenses() {
    const year = expenseMonth.getFullYear();
    const month = expenseMonth.getMonth();
    const prefix = `${year}-${String(month + 1).padStart(2,'0')}-`;
    const offset = (expenseMonth.getDay() + 6) % 7;
    const count = new Date(year,month+1,0).getDate();
    $('expenseMonth').textContent = monthLabel.format(expenseMonth);
    try {
      expenseRecords = readExpenses();
      $('expenseReadError').hidden = true;
    } catch {
      $('expenseReadError').textContent = '无法读取本机支出记录，请刷新后重试。';
      $('expenseReadError').hidden = false;
      $('expenseTotal').textContent = '—';
      $('expenseDays').replaceChildren();
      return;
    }
    const total = Object.entries(expenseRecords).reduce((sum,[day,cents]) =>
      day.startsWith(prefix) ? sum + cents : sum,0);
    $('expenseTotal').textContent = money(total);
    const currentDay = today();
    const days = Array.from({length:count},(_,index) => {
      const day = index + 1;
      const date = prefix + String(day).padStart(2,'0');
      const amount = Object.hasOwn(expenseRecords,date) ? money(expenseRecords[date]) : '';
      const label = date + (amount ? '，支出' + amount : '，填写支出');
      return `<button class="expense-day${amount ? ' has-expense' : ''}" type="button" data-expense-date="${date}"
        aria-label="${label}" ${date === currentDay ? 'aria-current="date"' : ''}>
        <span>${day}</span>${amount ? `<small>${amount}</small>` : ''}</button>`;
    });
    $('expenseDays').innerHTML = '<span aria-hidden="true"></span>'.repeat(offset) + days.join('');
  }

  function shiftExpenseMonth(change) {
    expenseMonth = new Date(expenseMonth.getFullYear(),expenseMonth.getMonth()+change,1);
    renderExpenses();
  }

  function saveExpense(cents) {
    try {
      const next = readExpenses();
      if (cents === null) delete next[expenseDate];
      else next[expenseDate] = cents;
      localStorage.setItem(expenseKey,JSON.stringify(next));
    } catch {
      $('expenseError').textContent = '无法保存支出，请检查浏览器存储后重试。';
      return;
    }
    $('expenseEditor').close();
    renderExpenses();
    $('expenseDays').querySelector(`[data-expense-date="${expenseDate}"]`)?.focus();
  }

  $('openExpenses').onclick = () => {
    const now = new Date();
    expenseMonth = new Date(now.getFullYear(),now.getMonth(),1);
    renderExpenses();
    showModule('expenses');
  };
  $('expensePrev').onclick = () => shiftExpenseMonth(-1);
  $('expenseNext').onclick = () => shiftExpenseMonth(1);
  $('expenseDays').onclick = event => {
    const date = event.target.closest('[data-expense-date]')?.dataset.expenseDate;
    if (!date) return;
    expenseDate = date;
    const exists = Object.hasOwn(expenseRecords,date);
    $('expenseDateHeading').textContent = date;
    $('expenseAmount').value = exists ? (expenseRecords[date]/100).toFixed(2) : '';
    $('expenseClear').hidden = !exists;
    $('expenseError').textContent = '';
    $('expenseEditor').showModal();
  };
  $('expenseCancel').onclick = () => $('expenseEditor').close();
  $('expenseClear').onclick = () => saveExpense(null);
  $('expenseForm').onsubmit = event => {
    event.preventDefault();
    saveExpense(Math.round($('expenseAmount').valueAsNumber*100));
  };
  window.addEventListener('storage',event => {
    if (!$('expenses').hidden && (event.key === expenseKey || event.key === null)) renderExpenses();
  });

  const paymentKey = 'goods-payments-v1';
  const paymentForm = $('paymentForm');
  const paymentChangeForm = $('paymentChangeForm');
  const paymentError = $('paymentError');
  const validPaymentAmount = amount => Number.isSafeInteger(amount) && amount > 0 && amount <= 999999999;
  const readCents = field => Math.round(field.valueAsNumber * 100);
  let paymentSelection;

  function readPayments(raw = localStorage.getItem(paymentKey)) {
    return validatePayments(JSON.parse(raw ?? '[]'));
  }

  function validatePayments(records) {
    if (!Array.isArray(records) || records.some(record =>
      !record || typeof record.name !== 'string' || !record.name.trim() || !validPaymentAmount(record.amount) ||
      (record.id !== undefined && (typeof record.id !== 'string' || !/^[\w-]+$/.test(record.id))) ||
      (record.note !== undefined && typeof record.note !== 'string') ||
      (record.status !== undefined && !['regular','unpaid'].includes(record.status)))) {
      throw Error('货款记录格式无效。');
    }
    return records.map((record,index) => ({
      ...record, id:record.id ?? `legacy-${index}`, status:record.status ?? 'regular', note:record.note ?? ''
    }));
  }

  function showPaymentError(message) {
    paymentError.textContent = message;
    paymentError.hidden = !message;
  }

  function renderPayments() {
    try {
      const records = readPayments();
      const total = records.reduce((sum,record) =>
        sum + (record.status === 'unpaid' ? -record.amount : record.amount),0);
      $('paymentTotal').textContent = total < 0 ? '−' + money(-total) : money(total);
      $('paymentList').innerHTML = records.reverse().map(record => {
        const unpaid = record.status === 'unpaid';
        const color = unpaid ? 'payment-negative' : 'payment-positive';
        return `<article><div class="row"><h3>${escape(record.name)}</h3>
          <strong class="${color}">${unpaid ? '−' : '+'}${money(record.amount)}</strong></div>
          <button type="button" class="tag payment-state ${color}" data-payment-action="status" data-payment-id="${record.id}" aria-label="修改款项状态：${unpaid ? '未支付' : '普通货款'}">${unpaid ? '未支付' : '普通货款'}</button>
          ${record.note ? `<p class="muted payment-note">${escape(record.note)}</p>` : ''}
          <div class="actions"><button type="button" data-payment-action="note" data-payment-id="${record.id}">备注</button>
          <button type="button" class="danger" data-payment-action="delete" data-payment-id="${record.id}">删除</button></div></article>`;
      }).join('') || '<p class="empty">暂无货款记录。</p>';
      showPaymentError('');
    } catch {
      $('paymentTotal').textContent = '—';
      $('paymentList').replaceChildren();
      showPaymentError('无法读取本机货款记录，请刷新后重试。');
    }
  }

  $('openPayments').onclick = () => {
    renderPayments();
    showModule('payments');
  };
  paymentForm.onsubmit = event => {
    event.preventDefault();

    const name = fields.paymentName.value.trim();

    }
    try {
      const records = readPayments();
      records.push({id:crypto.randomUUID(), name, amount, status:fields.paymentStatus.value, note:fields.paymentNote.value.trim()});
      localStorage.setItem(paymentKey,JSON.stringify(records));
    } catch {
      showPaymentError('无法保存货款，请检查浏览器存储后重试。');
      return;
    }
    paymentForm.reset();
    renderPayments();
  };

  $('paymentList').onclick = event => {
    const button = event.target.closest('[data-payment-action]');
    if (!button) return;
    try {
      const raw = localStorage.getItem(paymentKey);
      const record = readPayments(raw).find(entry => entry.id === button.dataset.paymentId);
      if (!record) { renderPayments(); return; }
      const action = button.dataset.paymentAction;
      const changeStatus = action === 'status';
      paymentSelection = {raw,record,action};
      if (action === 'delete') {
        if (confirm(`确认删除「${record.name}」${money(record.amount)}？`)) savePaymentChange();
        return;
      }
      const fields = paymentChangeForm.elements;
      fields.note.value = record.note;
      fields.status.value = record.status;
      $('paymentNoteField').hidden = changeStatus;
      $('paymentStatusField').hidden = !changeStatus;
      $('paymentChangeError').textContent = '';
      $('paymentChangeTitle').textContent = changeStatus ? '修改款项状态' : '备注';
      const field = changeStatus ? fields.status : fields.note;
      $('paymentChange').showModal();
      field.focus();
    } catch {
      showPaymentError('无法读取货款记录，请刷新后重试。');
    }
  };
  $('paymentChangeCancel').onclick = () => $('paymentChange').close();
  paymentChangeForm.onsubmit = event => {
    event.preventDefault();
    savePaymentChange();
  };

  function savePaymentChange() {
    const {raw,record,action} = paymentSelection;
    const remove = action === 'delete';
    const showError = remove ? showPaymentError : message => { $('paymentChangeError').textContent = message; };
    try {
      if (localStorage.getItem(paymentKey) !== raw) {
        showError('记录已在另一窗口更新，请刷新后重试。');
        return;
      }
      const records = readPayments(raw);
      const index = records.findIndex(entry => entry.id === record.id);
      const fields = paymentChangeForm.elements;
      if (remove) records.splice(index,1);
      else if (action === 'status') records[index].status = fields.status.value;
      else records[index].note = fields.note.value.trim();
      localStorage.setItem(paymentKey,JSON.stringify(records));
    } catch {
      showError('无法保存货款，请检查浏览器存储后重试。');
      return;
    }
    if (!remove) $('paymentChange').close();
    renderPayments();
  }
  window.addEventListener('storage',event => {
    if (!$('payments').hidden && (event.key === paymentKey || event.key === null)) renderPayments();
  });

  $('openInventory').onclick = () => showModule('inventory');
  $('openDropship').onclick = () => { showDropView('orders'); showModule('dropship'); };
  for (const button of document.querySelectorAll('[data-home]')) button.onclick = () => showModule('hub');
  $('dropMenu').onclick = () => setSidebar($('dropSidebar').hidden);
  phoneLayout.addEventListener('change',() => setSidebar(false));
  $('dropSidebar').onclick = event => {
    const view = event.target.closest('[data-drop-view]')?.dataset.dropView;
    if (view) showDropView(view);
  };
  $('dropQuery').oninput = renderDropship;
  $('dropFilter').onchange = renderDropship;
  $('newDropOrder').onclick = () => openDropForm();
  $('cancelDropOrder').onclick = () => $('dropEditor').close();
  $('closeDropDetail').onclick = () => $('dropDetail').close();

  function describeSpec({network,fingerprint,memory}) {
    return `${network} · ${fingerprint} · ${memory} GB`;
  }

  function replacementSpec(order) {
    return order.exchange.spec ? describeSpec(order.exchange.spec) : '沿用原配置';
  }

  function syncExchangeFields() {
    const fields = $('dropServiceForm').elements;
    const exchange = fields.namedItem('kind').value === 'exchange';
    const changeSpec = exchange && fields.namedItem('changeSpec').value === 'yes';
    $('dropExchangeFields').hidden = !exchange;
    $('dropExchangeSpecs').hidden = !changeSpec;
    fields.namedItem('changeSpec').disabled = !exchange;
    for (const [name,enabled] of [
      ['exchangeTracking',exchange],['network',changeSpec],['fingerprint',changeSpec],['memory',changeSpec]
    ]) {
      const input = fields.namedItem(name);
      input.disabled = !enabled;
      input.required = enabled;
    }
  }

  $('dropServiceForm').onchange = syncExchangeFields;
  $('cancelDropService').onclick = () => $('dropService').close();
  $('dropServiceForm').onsubmit = event => {
    event.preventDefault();
    const kind = event.target.elements.namedItem('kind').value;
    const order = dropState.orders.find(order => order.id === serviceId);
    try {
      if (!order) throw Error('这笔订单已不存在。');
      if (!Object.hasOwn(serviceNames,kind)) throw Error('请选择换货或退货。');
      const updated = {...order,afterSales:kind};
      if (kind === 'exchange') {
        const fields = event.target.elements;
        const tracking = fields.namedItem('exchangeTracking').value.trim();
        if (!tracking) throw Error('请填写换货单号。');
        if (tracking.toLowerCase() === (order.tracking ?? '').trim().toLowerCase()) {
          throw Error('换货单号需与原单号不同。');
        }
        let spec = null;
        if (fields.namedItem('changeSpec').value === 'yes') {
          spec = Object.fromEntries(['network','fingerprint','memory'].map(name => [name,fields.namedItem(name).value]));
          if (!Object.values(spec).every(Boolean)) throw Error('请选择完整的换货配置。');
        }
        updated.exchange = {tracking,spec};
      }
      if (order.afterSales !== kind || JSON.stringify(order.exchange) !== JSON.stringify(updated.exchange)) {
        saveDropship(dropState.orders.map(o => o.id === serviceId ? updated : o),'售后 · '+serviceNames[kind],updated);
      }
      $('dropService').close();
    } catch (error) {
      $('dropServiceError').textContent = error.message;
    }
  };

  $('dropForm').onsubmit = event => {
    event.preventDefault();
    const values = Object.fromEntries([...new FormData(event.target)].map(([name,value]) => [name,value.trim()]));
    try {
      if (!values.supplier || !values.network || !values.fingerprint || !values.memory) {
        throw Error('请选好网络、指纹和内存，并填写代发渠道。');
      }
      const previous = dropState.orders.find(order => order.id === editedId);
      if (editedId && !previous) throw Error('这笔订单已不存在。');
      const order = {
        ...previous,...values,id:editedId || crypto.randomUUID(),
        product:describeSpec(values),
        cost:Math.round(Number(values.cost)*100),price:Math.round(Number(values.price)*100)
      };
      const orders = editedId ? dropState.orders.map(o => o.id === editedId ? order : o) : [order,...dropState.orders];
      saveDropship(orders,editedId ? '编辑订单 · '+statusNames[order.status] : '新增订单',order);
      $('dropEditor').close();
    } catch (error) {
      $('dropError').textContent = error.message;
    }
  };

  $('dropRows').onclick = event => {
    const button = event.target.closest('[data-drop-action]');
    if (!button) return;
    const order = dropState.orders.find(o => o.id === button.dataset.id);
    if (!order) return;
    const command = button.dataset.dropAction;
    if (command === 'edit') { openDropForm(order); return; }
    if (command === 'service') {
      serviceId = order.id;
      const form = $('dropServiceForm');
      form.reset();
      form.elements.namedItem('kind').value = order.afterSales ?? '';
      form.elements.namedItem('exchangeTracking').value = order.exchange?.tracking ?? '';
      form.elements.namedItem('changeSpec').value = order.exchange?.spec ? 'yes' : 'no';
      for (const name of ['network','fingerprint','memory']) {
        form.elements.namedItem(name).value = order.exchange?.spec?.[name] ?? order[name] ?? '';
      }
      syncExchangeFields();
      $('dropServiceError').textContent = '';
      $('dropService').showModal();
      return;
    }
    if (command === 'detail') {
      const fields = [[order.exchange ? '原配置' : '商品规格',order.product],['代发渠道',order.supplier],
        ['下单日期',order.date],['状态',statusNames[order.status]],['售后类型',Object.hasOwn(serviceNames,order.afterSales) ? serviceNames[order.afterSales] : ''],[order.exchange ? '原单号' : '快递单号',order.tracking],
        ...(order.exchange ? [['换货单号',order.exchange.tracking],['换货配置',replacementSpec(order)]] : []),
        ['成本',money(order.cost)],['售价',money(order.price)],['单笔利润',money(order.price-order.cost)],['收货地址',order.address],['备注',order.note]];
      $('dropDetailRows').innerHTML = fields.map(([label,value]) =>
        `<dt>${label}</dt><dd>${escape(value || '—')}</dd>`).join('');
      $('dropDetail').showModal();
      return;
    }
    try {
      if (command === 'advance' && nextStatus[order.status]) {
        const updated = {...order,status:nextStatus[order.status]};
        saveDropship(dropState.orders.map(o => o.id === order.id ? updated : o),'标记'+statusNames[updated.status],updated);
      }
      if (command === 'delete' && confirm('删除这笔代发订单？')) {
        saveDropship(dropState.orders.filter(o => o.id !== order.id),'删除订单',order);
      }
    } catch (error) { alert(error.message); }
  };

  function readInventoryBackup(raw) {
    const data = JSON.parse(raw ?? 'null');
    if (raw === null) return {items:[],logs:[]};
    if (Array.isArray(data)) return {items:validate(data),logs:[]};
    return {items:validate(data?.items),logs:validateLogs(data?.logs)};
  }

  function validateDropshipBackup(data) {
    const optionalText = value => value == null || typeof value === 'string';
    const amount = value => Number.isSafeInteger(value) && value >= 0;
    if (!Array.isArray(data?.orders) || !Array.isArray(data.logs) ||
      data.orders.some(order => !order || typeof order.id !== 'string' || typeof order.date !== 'string' ||
        !Object.hasOwn(statusNames,order.status) || !amount(order.price) || !amount(order.cost) ||
        !optionalText(order.tracking) || !optionalText(order.exchange?.tracking)) ||
      data.logs.some(entry => !entry || typeof entry.action !== 'string' ||
        !Number.isFinite(Date.parse(entry.at)))) throw Error('代发数据格式无效。');
    return data;
  }

  function restoreFullBackup(backup) {
    const inventory = readInventoryBackup(JSON.stringify(backup.inventory));
    const modules = [
      [dropKey,validateDropshipBackup(backup.dropship)],
      [expenseKey,validateExpenses(backup.expenses)],
      [paymentKey,validatePayments(backup.payments)]
    ];
    const keys = [key,...modules.map(([name]) => name)];
    const previous = new Map(keys.map(name => [name,localStorage.getItem(name)]));
    if (!confirm('用这份全站备份覆盖拍机堂、代发、超擦支出和货款明细的当前数据？')) return false;
    if (keys.some(name => localStorage.getItem(name) !== previous.get(name)) || previous.get(key) !== source) {
      throw Error('数据已在另一窗口更新，请刷新后重试。');
    }
    const written = [];
    try {
      for (const [name,value] of modules) {
        localStorage.setItem(name,JSON.stringify(value));
        written.push(name);
      }
      save(inventory.items,'导入备份','恢复全站数据',{recover:true,previousLogs:inventory.logs});
    } catch (error) {
      for (const name of written.reverse()) {
        const raw = previous.get(name);
        if (raw === null) localStorage.removeItem(name);
        else localStorage.setItem(name,raw);
      }
      throw error;
    }
    readDropship();
    return true;
  }

  $('backup').onclick = () => $('backupPanel').showModal();
  $('closeBackup').onclick = () => $('backupPanel').close();
  $('restore').onclick = () => $('file').click();
  $('export').onclick = () => {
    try {
      const backup = {
        version:2,
        inventory:readInventoryBackup(localStorage.getItem(key)),
        dropship:validateDropshipBackup(JSON.parse(localStorage.getItem(dropKey) ?? '{"orders":[],"logs":[]}')),
        expenses:readExpenses(),
        payments:readPayments()
      };
      const url = URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));
      const link = document.createElement('a');
      link.href = url;
      link.download = '闲鱼全站备份-'+today()+'.json';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url),30000);
    } catch (error) { alert('导出失败：'+error.message); }
  };
  $('file').onchange = async event => {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    try {
      const backup = JSON.parse(await file.text());
      if (backup?.version === 2) {
        if (!restoreFullBackup(backup)) return;
      } else if (backup?.version === 1) {
        validate(backup.items);
        const previousLogs = backup.logs === undefined ? logs : validateLogs(backup.logs);
        if (!confirm('用这份旧备份覆盖当前拍机堂的数据？')) return;
        save(backup.items,'导入备份','恢复 '+backup.items.length+' 台设备',{recover:true,previousLogs});
      } else {
        throw Error('备份版本无效。');
      }
      $('query').value = '';
      $('backupPanel').close();
      tab(page);
      alert('备份已导入。');
    } catch (error) { alert('导入失败：'+error.message); }
  };

  window.addEventListener('storage',event => {
    if (event.key === dropKey) readDropship();
  });
  setSidebar(false);
  readDropship();
})();
</script>
</html>
