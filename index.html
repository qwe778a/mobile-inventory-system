<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍机堂出入库</title>
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#172d49;background:#f2f6fc;--blue:#174a92;--line:#d7e2f2}
*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:24px 16px 110px}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{min-height:44px;border:0;border-radius:12px;padding:8px 13px;background:#e6eefb;color:var(--blue);font-weight:650}button.primary{background:var(--blue);color:white}header,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{justify-content:flex-start;flex-wrap:wrap}h1{font-size:26px;margin:0}h2{font-size:21px;margin:0}h3{font-size:17px;margin:0}p{margin:8px 0}small,.muted{color:#4c607c}.hero{margin:22px 0;background:var(--blue);color:white;border-radius:22px;padding:20px}.hero small{color:#dbeaff}.metrics,.fields,.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics{margin-top:14px}.metric{padding:12px;background:#ffffff18;border-radius:12px;overflow-wrap:anywhere}.metric strong{display:block;font-size:20px;margin-top:5px}.filters{margin:14px 0}.wide{grid-column:1/-1}label{display:grid;gap:5px;font-size:14px}input,select,textarea{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px;background:white;color:inherit;font-size:16px}article,.empty{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;overflow-wrap:anywhere}.group{margin-top:18px}.tag{background:#e6eefb;padding:4px 8px;border-radius:20px;font-size:13px;white-space:nowrap}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:1}nav div{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:780px;margin:auto}nav button{background:white;padding:5px}nav button[aria-current=true]{background:#d9e8ff}dialog{border:0;border-radius:18px;width:min(94vw,520px);max-height:90dvh;padding:18px;color:inherit}dialog::backdrop{background:#102b50aa}dialog .actions{margin-top:14px}#notice{color:#9a301e}output{display:block}.danger{color:#983727}
.scan-field{display:grid;gap:6px;align-content:start;min-width:0}.scan-field button{justify-self:start}#scanVideo{width:100%;max-height:42dvh;object-fit:contain;background:#172d49;border-radius:12px}
.more{position:relative}.more summary{list-style:none;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;background:#e6eefb;color:var(--blue);font-weight:700}.more summary::-webkit-details-marker{display:none}.more-options{position:absolute;right:0;top:calc(100% + 6px);z-index:2;min-width:132px;display:grid;gap:6px;background:white;padding:6px;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px #172d4926}#logList{padding:0;list-style:none}#logList li{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}#logList time{display:block;color:#4c607c;font-size:14px;margin-top:4px}
</style>
<main>
<header><h1>拍机堂出入库</h1><details class="more" id="more"><summary aria-label="更多">•••</summary><div class="more-options"><button id="backup">数据备份</button><button id="logs">日志</button></div></details></header>
<section class="hero" aria-label="统计"><small id="summaryTitle"></small><div class="metrics" id="metrics"></div></section>
<div class="row"><h2 id="heading"></h2><button class="primary" id="add"></button></div>
<div class="filters">
<label class="wide">搜索<input id="query" type="search" placeholder="完整物品编号或单号" autocapitalize="off" spellcheck="false"></label>
<label>状态<select id="filter"></select></label>
<label>清除筛选<button id="reset">显示全部</button></label>
</div>
<section id="records"></section>
</main>
<nav aria-label="功能"><div id="tabs"></div></nav>
<dialog id="editor"><h2 id="formTitle"></h2><form id="form"><div id="fields" class="fields"></div><output id="notice" role="alert"></output><div class="actions"><button class="primary">保存</button><button type="button" id="cancel">取消</button></div></form></dialog>
<dialog id="scanPanel"><h2>扫码录入物品编号</h2><p id="scanStatus" role="status"></p><video id="scanVideo" autoplay playsinline muted></video><div class="actions"><button type="button" id="closeScan">关闭扫码</button></div></dialog>
<dialog id="backupPanel"><h2>数据备份</h2><p>数据保存在当前浏览器。换设备或清除浏览器数据前，请先导出。</p><div class="actions"><button id="export">导出 JSON</button><button id="restore">导入备份</button><button id="closeBackup">关闭</button></div><input id="file" type="file" accept=".json,application/json" hidden></dialog>
<dialog id="logPanel"><div class="row"><h2>操作日志</h2><button id="closeLog">关闭</button></div><ul id="logList"></ul></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'phone-inventory-v1';
const names = {stock:'库存', inbound:'入库', sold:'出库', profit:'利润', service:'售后'};
const states = {available:'在库', sold:'已售出', open:'售后处理中', closed:'售后已完成', returned:'退货已回库'};
const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const money = cents => '¥' + (cents/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const status = item => item.service?.state === 'returned' ? 'returned' : item.service?.state ?? (item.sale ? 'sold' : 'available');
const inStock = item => !item.sale || status(item) === 'returned';
const activeSale = item => item.sale && status(item) !== 'returned';
let page = 'stock';
let storageError = false;
let source = null;
let items = [];
let logs = [];
try {
  source = localStorage.getItem(key);
  if (source !== null) {
    const data = JSON.parse(source);
    if (Array.isArray(data)) items = validate(data);
    else {
      const savedLogs = validateLogs(data.logs);
      items = validate(data.items);
      logs = savedLogs;
    }
  }
} catch { storageError = true; }
let mode, selected;

function validItemCode(value) {
  return value.length > 0 && value.length <= 128 && value === value.trim() && !/[\u0000-\u001f\u007f]/.test(value);
}

function validate(data) {
  const date = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
    Number.isFinite(Date.parse(value)) && new Date(value).toISOString().slice(0,10) === value;
  const amount = value => Number.isSafeInteger(value) && value >= 0 && value <= 99999999999;
  const ids = new Set(), imeis = new Set(), serials = new Set();
  if (!Array.isArray(data)) throw Error('备份格式无效');
  for (const item of data) {
    if (!item || typeof item.id !== 'string' || !/^[\w-]+$/.test(item.id) || ids.has(item.id) ||
        typeof item.model !== 'string' || !item.model.trim() || typeof item.imei !== 'string' ||
        !/^\d{15}$/.test(item.imei) || imeis.has(item.imei) || typeof item.serial !== 'string' ||
        !validItemCode(item.serial) || serials.has(item.serial.toUpperCase()) || !amount(item.cost) ||
        (item.inbound !== null && !date(item.inbound)) ||
        (item.sale && (!date(item.sale.date) || !amount(item.sale.price) || item.sale.date < item.inbound)) ||
        (!item.sale && !item.inbound) ||
        (item.history !== undefined && (!Array.isArray(item.history) || item.history.some(entry =>
          !entry || !date(entry.sale?.date) || !amount(entry.sale.price) ||
          !date(entry.service?.date) || entry.service.date < entry.sale.date ||
          entry.service.state !== 'returned' || typeof entry.service.reason !== 'string'))) ||
        (item.service && (!item.sale || !date(item.service.date) || item.service.date < item.sale.date ||
          !['open','closed','returned'].includes(item.service.state) ||
          typeof item.service.reason !== 'string' || !item.service.reason.trim()))) {
      throw Error('记录无效或 IMEI / 物品编号重复，请检查日期和设备信息');
    }
    ids.add(item.id); imeis.add(item.imei); serials.add(item.serial.toUpperCase());
  }
  return data;
}

function validateLogs(data) {
  if (!Array.isArray(data) || data.some(entry => !entry ||
      typeof entry.action !== 'string' || typeof entry.detail !== 'string' ||
      !Number.isFinite(Date.parse(entry.time)))) throw Error('日志格式无效');
  return data;
}

function save(next, action, detail, {recover = false, previousLogs = logs} = {}) {
  validate(next);
  if (storageError && !recover) throw Error('现有数据无法读取，请从有效备份恢复');
  if (localStorage.getItem(key) !== source) throw Error('另一窗口已更新数据，请刷新后重试');
  const nextLogs = [{time:new Date().toISOString(), action, detail}, ...previousLogs];
  const encoded = JSON.stringify({items:next,logs:nextLogs});
  localStorage.setItem(key, encoded);
  source = encoded;
  items = next;
  logs = nextLogs;
  storageError = false;
}

function tab(next) {
  page = next;
  $('filter').innerHTML = '<option value="">全部状态</option>' +
    Object.entries(states).filter(([code]) => page !== 'service' || ['open','closed','returned'].includes(code))
      .map(([code,label]) => `<option value="${code}">${label}</option>`).join('');
  render();
}

function dateFor(item) {
  if (page === 'service') return item.service.date;
  if (page === 'sold' || page === 'profit') return item.sale.date;
  return status(item) === 'returned' && page === 'stock' ? item.service.date : item.inbound;
}

function totals(rows) {
  const sales = rows.filter(activeSale);
  const revenue = sales.reduce((sum,item) => sum + item.sale.price,0);
  const cost = sales.reduce((sum,item) => sum + item.cost,0);
  return [['有效出库',sales.length+' 台'],['销售额',money(revenue)],['销售成本',money(cost)],['毛利润',money(revenue-cost)]];
}

function action(label, command, item, style = '') {
  return `<button class="${style}" data-command="${command}" data-id="${item.id}">${label}</button>`;
}

function card(item) {
  const historyInfo = item.history?.length ? `<details><summary>历史退货（${item.history.length} 笔）</summary>
    ${item.history.map(entry => `<p>出库 ${escape(entry.sale.date)} · ${money(entry.sale.price)} ${entry.sale.tracking ? '· 单号 '+escape(entry.sale.tracking) : ''} · 退货 ${escape(entry.service.date)} · ${escape(entry.service.reason)}</p>`).join('')}</details>` : '';
  const tracking = item.sale?.tracking ? `<p class="muted">单号 ${escape(item.sale.tracking)}</p>` : '';
  const saleInfo = item.sale && page !== 'stock' && page !== 'inbound'
    ? `<p>售价 ${money(item.sale.price)} · ${escape(item.sale.channel || '未填写销售渠道')}</p>` : '';
  const serviceInfo = item.service && page === 'service'
    ? `<p>${escape(item.service.reason)}</p><p class="muted">${escape(item.service.note)}</p>` : '';
  let buttons = '';
  if (page === 'stock' || page === 'inbound') {
    buttons = action('编辑','device',item);
    if (inStock(item)) buttons += action('标记售出','sell',item,'primary');
    if (!item.sale && !item.history?.length) buttons += action('删除','deleteDevice',item,'danger');
  }
  if (page === 'sold') {
    buttons = action('编辑','saleEdit',item) + action(item.service ? '编辑售后' : '转售后','service',item);
    if (!item.service) buttons += action('删除出库','deleteSale',item,'danger');
  }
  if (page === 'service') buttons = action('编辑 / 标记状态','service',item) + action('删除售后','deleteService',item,'danger');
  return `<article><div class="row"><h3>${escape(item.model)} ${escape(item.capacity)}</h3><span class="tag">${states[status(item)]}</span></div>
    <p class="muted">IMEI ${escape(item.imei)} · 物品编号 ${escape(item.serial)}</p>
    <p>成本 ${money(item.cost)} ${escape(item.channel || '')}</p>
    ${saleInfo}${tracking}${serviceInfo}${historyInfo}<p class="muted">${escape(item.note || '')}</p>
    <div class="actions">${buttons}</div></article>`;
}

function render() {
  $('heading').textContent = names[page];
  const addLabel = {stock:'＋ 入库',inbound:'＋ 录入',sold:'＋ 直接出库'};
  $('add').hidden = !addLabel[page];
  $('add').textContent = addLabel[page] || '';
  $('tabs').innerHTML = Object.entries(names).map(([code,label]) =>
    `<button data-tab="${code}" aria-current="${code === page}">${label}</button>`).join('');
  const query = $('query').value.trim().toLowerCase();
  const filter = $('filter').value;
  const rows = items.filter(item => {
    if (!({stock:inStock(item),inbound:item.inbound,sold:item.sale,profit:activeSale(item),service:item.service})[page]) return false;
    return (!filter || status(item) === filter) && (!query ||
      [item.serial,item.sale?.tracking,...(item.history ?? []).map(entry => entry.sale.tracking)]
        .some(value => String(value ?? '').trim().toLowerCase() === query));
  });
  const cost = list => money(list.reduce((sum,item) => sum+item.cost,0));
  const stats = page === 'profit' || page === 'sold' ? totals(rows) : page === 'service'
    ? [['售后记录',rows.length+' 单'],['处理中',rows.filter(item => status(item) === 'open').length+' 单']]
    : [[page === 'stock' ? '在库数量' : '入库数量',rows.length+' 台'],['设备成本',cost(rows)]];
  $('summaryTitle').textContent = names[page]+' · 当前筛选统计';
  $('metrics').innerHTML = stats.map(([label,value]) => `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`).join('');
  const groups = new Map();
  for (const item of rows.sort((a,b) => dateFor(b).localeCompare(dateFor(a)))) {
    const date = dateFor(item);
    if (!groups.has(date)) groups.set(date,[]);
    groups.get(date).push(item);
  }
  $('records').innerHTML = [...groups].map(([date,list]) => {
    const caption = page === 'profit' || page === 'sold' ? totals(list).map(pair => pair.join(' ')).join(' · ')
      : `${list.length} 条${page === 'service' ? '' : ' · 成本 '+cost(list)}`;
    return `<section class="group"><h3>${escape(date)}</h3><p class="muted">${caption}</p>${list.map(card).join('')}</section>`;
  }).join('') || '<p class="empty">'+(storageError ? '本机数据无法读取，请从有效备份恢复。' : '暂无符合条件的记录。')+'</p>';
}

function field(name,label,value='',attrs='',type='text') {
  return `<label>${label}<input name="${name}" type="${type}" value="${escape(value)}" ${attrs}></label>`;
}
function choice(name,label,options,current,defaultValue) {
  const value = current || defaultValue;
  const values = options.includes(value) ? options : [...options, value];
  return `<label>${label}<select name="${name}">${values.map(option =>
    `<option value="${escape(option)}" ${option === value ? 'selected' : ''}>${escape(option)}</option>`
  ).join('')}</select></label>`;
}

function customChoice(name,label,options,current,defaultValue) {
  const custom = current && current !== '其他' && !options.includes(current) ? current : '';
  const selected = custom ? '其他' : current;
  return `<div class="scan-field">${choice(name,label,[...options,'其他'],selected,defaultValue)}
    <div${selected === '其他' ? '' : ' hidden'}>
      ${field(name+'Custom','自定义'+label,custom,'maxlength="80"')}
    </div></div>`;
}

function syncCustomChoice(select) {
  const input = select.form.elements.namedItem(select.name+'Custom');
  if (!input) return;
  const isCustom = select.value === '其他';
  input.closest('label').parentElement.hidden = !isCustom;
  input.disabled = !isCustom;
}

function itemCodeField(value) {
  return `<div class="scan-field">${field('serial','物品编号',value,'required maxlength="128" autocapitalize="off" spellcheck="false"')}
    <button type="button" data-scan aria-label="扫码录入物品编号">扫码录入</button></div>`;
}

function note(value) {
  return `<label class="wide">备注<textarea name="note">${escape(value)}</textarea></label>`;
}
function openForm(next,item) {
  mode = next;
  selected = item;
  const deviceFields = ['device','direct'].includes(mode);
  const selling = ['direct','sell','saleEdit'].includes(mode);
  const service = item?.service;
  const sale = mode === 'saleEdit' ? item.sale : null;
  const amount = (name,label,value) => field(name,label,value == null ? '' : value/100,
    'inputmode="decimal" min="0" max="999999999.99" step="0.01" required','number');
  $('formTitle').textContent = {device:item ? '编辑设备' : '新增入库',sell:'标记售出',direct:'直接登记出库',saleEdit:'编辑出库',service:'售后登记'}[mode];
  let html = '';
  if (deviceFields) {
    html += customChoice('model','型号',['原机','原机Wi-Fi'],item?.model,'原机') +
      choice('capacity','容量',['32','128','256'],item?.capacity,'128') +
      field('imei','IMEI',item?.imei,'required inputmode="numeric" pattern="[0-9]{15}" maxlength="15"') +
      itemCodeField(item?.serial) +
      amount('cost','成本（元）',item?.cost) +
      customChoice('channel','进货渠道',['拍机堂'],item?.channel,'拍机堂');
    if (mode === 'device' && (!item || item.inbound)) html += field('inbound','入库日期',item?.inbound || today(),'required','date');
    html += note(item?.note ?? '');
  }
  if (selling) {
    html += field('date','出库日期',sale?.date || today(),'required','date') +
      amount('price','售价（元）',sale?.price) + field('saleChannel','销售渠道',sale?.channel) +
      field('tracking','单号',sale?.tracking);
  }
  if (mode === 'service') {
    html = field('date','售后日期',service?.date || today(),'required','date') +
      field('reason','售后原因',service?.reason,'required maxlength="200"') +
      `<label class="wide">处理状态<select name="state">${['open','closed','returned'].map(state =>
        `<option value="${state}" ${service?.state === state ? 'selected' : ''}>${states[state]}</option>`).join('')}</select></label>` +
      note(service?.note ?? '');
  }
  $('fields').innerHTML = html;
  for (const select of $('fields').querySelectorAll('select[name="model"], select[name="channel"]')) {
    syncCustomChoice(select);
  }
  $('notice').textContent = '';
  $('editor').showModal();
}

$('form').addEventListener('submit',event => {
  event.preventDefault();
  const values = Object.fromEntries([...new FormData(event.target)].map(([name,value]) => [name,value.trim()]));
  try {
    const item = selected ? {...selected} : {id:crypto.randomUUID(),inbound:null};
    if (mode === 'device' || mode === 'direct') Object.assign(item,{
      model:values.model === '其他' ? values.modelCustom || '其他' : values.model, capacity:values.capacity, imei:values.imei, serial:values.serial,
      cost:Math.round(Number(values.cost)*100), channel:values.channel === '其他' ? values.channelCustom || '其他' : values.channel, note:values.note, inbound:mode === 'direct' ? null : values.inbound || item.inbound
    });
    if (mode === 'sell' && item.service?.state === 'returned') {
      if (values.date < item.service.date) throw Error('再次出库日期应晚于或等于回库日期');
      item.history = [...(item.history || []), {sale:item.sale, service:item.service}];
      item.inbound ||= item.service.date;
      delete item.service;
    }
    if (['direct','sell','saleEdit'].includes(mode)) item.sale = {
      date:values.date, price:Math.round(Number(values.price)*100), channel:values.saleChannel, tracking:values.tracking
    };
    if (mode === 'service') item.service = {date:values.date, reason:values.reason, state:values.state, note:values.note};
    const actionName = {
      device:selected ? '编辑设备' : '新增入库', direct:'直接出库', sell:'标记售出',
      saleEdit:'编辑出库', service:selected?.service ? '更新售后 · '+states[values.state] : '新增售后 · '+states[values.state]
    }[mode];
    save(selected ? items.map(old => old.id === item.id ? item : old) : [...items,item], actionName, describeItem(item));
    $('query').value = '';
    $('editor').close();
    tab(mode === 'direct' || mode === 'sell' ? 'sold' : page);
  } catch (error) { $('notice').textContent = error.message; }
});

$('records').addEventListener('click',event => {
  const button = event.target.closest('button[data-command]');
  if (!button) return;
  const item = items.find(row => row.id === button.dataset.id);
  const command = button.dataset.command;
  if (!command.startsWith('delete')) { openForm(command,item); return; }
  const warning = {
    deleteDevice:'确定删除这台设备及关联记录？',
    deleteSale:item.inbound ? '删除出库记录并恢复在库？' : '删除直接出库记录及对应设备？',
    deleteService:'删除售后记录并恢复已售出状态？'
  }[command];
  if (!confirm(warning)) return;
  try {
    const next = items.flatMap(row => {
      if (row.id !== item.id) return [row];
      if (command === 'deleteDevice' || (command === 'deleteSale' && !row.inbound)) return [];
      const updated = {...row};
      delete updated[command === 'deleteSale' ? 'sale' : 'service'];
      return [updated];
    });
    const actionName = {deleteDevice:'删除设备',deleteSale:'删除出库',deleteService:'删除售后'}[command];
    save(next,actionName,describeItem(item));
    render();
  } catch (error) { alert(error.message); }
});
let scannerLibrary;
let scanSession;

function loadScanner() {
  if (!scannerLibrary) {
    scannerLibrary = new Promise((resolve,reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
      script.onload = () => {
        const Reader = window.ZXingBrowser?.BrowserMultiFormatReader;
        if (Reader) resolve(Reader);
        else reject(Error('扫码组件不可用'));
      };
      script.onerror = () => {
        script.remove();
        reject(Error('扫码组件加载失败'));
      };
      document.head.append(script);
    }).catch(error => {
      scannerLibrary = null;
      throw error;
    });
  }
  return scannerLibrary;
}

function stopScan() {
  const session = scanSession;
  scanSession = null;
  clearTimeout(session?.timer);
  session?.stream?.getTracks().forEach(track => track.stop());
  $('scanVideo').srcObject = null;
}

async function openScan() {
  stopScan();
  const session = {};
  scanSession = session;
  const video = $('scanVideo');
  const panel = $('scanPanel');
  $('scanStatus').textContent = '正在打开相机…';
  panel.showModal();
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Error('当前浏览器无法打开相机，请用 Safari 打开网站或手动输入。');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false, video:{facingMode:{ideal:'environment'},width:{ideal:1280}}
    });
    if (scanSession !== session) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    session.stream = stream;
    video.srcObject = stream;
    await video.play();
    if (scanSession !== session) return;
    const Reader = await loadScanner();
    if (scanSession !== session) return;
    const reader = new Reader();
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d',{willReadFrequently:true});
    $('scanStatus').textContent = '把条形码或二维码放进画面。';
    const scanFrame = () => {
      if (scanSession !== session) return;
      let result;
      if (video.readyState >= 2 && video.videoWidth) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video,0,0);
        try { result = reader.decodeFromCanvas(canvas); } catch { /* No readable code in this frame. */ }
      }
      if (result) {
        const value = result.getText().trim();
        if (validItemCode(value)) {
          $('form').elements.namedItem('serial').value = value;
          stopScan();
          panel.close();
          return;
        }
        $('scanStatus').textContent = '无法识别有效物品编号，请换一个码。';
      }
      session.timer = setTimeout(scanFrame,250);
    };
    scanFrame();
  } catch (error) {
    if (scanSession !== session) return;
    stopScan();
    $('scanStatus').textContent = error.name === 'NotAllowedError'
      ? '相机权限未开启，请允许 Safari 使用相机，或关闭扫码后手动输入。'
      : '相机或扫码组件暂不可用，可关闭扫码后手动输入。';
  }
}

$('fields').addEventListener('click',event => {
  const button = event.target.closest('button[data-scan]');
  if (button) openScan();
});
$('fields').addEventListener('change',event => {
  if (event.target.matches('select[name="model"], select[name="channel"]')) syncCustomChoice(event.target);
});
$('closeScan').onclick = () => {
  stopScan();
  $('scanPanel').close();
};
$('scanPanel').addEventListener('cancel',stopScan);
$('scanPanel').addEventListener('close',() => {
  if (!$('scanPanel').open) stopScan();
});
window.addEventListener('pagehide',stopScan);

$('tabs').onclick = event => { if (event.target.dataset.tab) tab(event.target.dataset.tab); };
$('add').onclick = () => openForm(page === 'sold' ? 'direct' : 'device');
$('cancel').onclick = () => $('editor').close();
$('query').oninput = render;
$('filter').onchange = render;
$('reset').onclick = () => {
  for (const id of ['query','filter']) $(id).value = '';
  render();
};
function describeItem(item) {
  const tracking = item.sale?.tracking;
  return item.model+' · 物品编号 '+item.serial+(tracking ? ' · 单号 '+tracking : '');
}
document.addEventListener('click',event => {
  if (!$('more').contains(event.target)) $('more').open = false;
});
$('more').addEventListener('keydown',event => {
  if (event.key === 'Escape') {
    $('more').open = false;
    $('more').querySelector('summary').focus();
  }
});
$('backup').onclick = () => {
  $('more').open = false;
  $('backupPanel').showModal();
};
$('logs').onclick = () => {
  $('more').open = false;
  $('logList').innerHTML = logs.map(entry =>
    `<li><strong>${escape(entry.action)}</strong><p>${escape(entry.detail)}</p><time datetime="${escape(entry.time)}">${new Date(entry.time).toLocaleString('zh-CN',{hour12:false})}</time></li>`
  ).join('') || '<li>暂无操作日志</li>';
  $('logPanel').showModal();
};
$('closeLog').onclick = () => $('logPanel').close();
$('closeBackup').onclick = () => $('backupPanel').close();
$('restore').onclick = () => $('file').click();
$('export').onclick = () => {
  if (storageError) { alert('当前数据无法正常读取'); return; }
  const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,items,logs},null,2)],{type:'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = '拍机堂出入库-'+today()+'.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url),30000);
};
$('file').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const backup = JSON.parse(await file.text());
    if (backup.version !== 1) throw Error('备份版本无效');
    validate(backup.items);
    const previousLogs = backup.logs === undefined ? logs : validateLogs(backup.logs);
    if (!confirm('用这份备份替换当前所有数据？')) return;
    save(backup.items,'导入备份','恢复 '+backup.items.length+' 台设备',{recover:true,previousLogs});
    $('query').value = '';
    $('backupPanel').close();
    tab(page);
  } catch (error) { alert('导入失败：'+error.message); }
};
window.addEventListener('storage',event => {
  if (event.key === key || event.key === null) location.reload();
});
tab(page);
</script>
</html>
